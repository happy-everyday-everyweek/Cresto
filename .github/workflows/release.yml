name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.0-alpha1085-custom.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          CODE=$(printf '%s' "$TAG" | sed -nE 's/.*alpha([0-9]+).*/\1/p')
          if [ -z "$CODE" ]; then
            CODE=$(sed -nE 's/^VERSION_CODE=(.*)$/\1/p' app/version.properties)
          fi
          NAME=$(printf '%s' "$TAG" | sed -E 's/^v//')
          {
            echo "tag=$TAG"
            echo "code=$CODE"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG code=$CODE name=$NAME"

      - name: Apply version to build
        run: |
          sed -i -E "s/^VERSION_CODE=.*/VERSION_CODE=${{ steps.version.outputs.code }}/" app/version.properties
          sed -i -E "s/^VERSION_NAME=.*/VERSION_NAME=${{ steps.version.outputs.name }}/" app/version.properties
          cat app/version.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKBIN=$(dirname "$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)")
          echo "使用 $SDKBIN/sdkmanager"
          yes | "$SDKBIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          # API 37 的平台包名带小版本号（platforms;android-37.0）。
          "$SDKBIN/sdkmanager" --install "platforms;android-37.0" > /dev/null
          "$SDKBIN/sdkmanager" --install "build-tools;37.0.0" > /dev/null || true
          "$SDKBIN/sdkmanager" --list_installed 2>/dev/null | grep -E 'platforms;|build-tools;' | head -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          MOMENTO_SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/cresto-custom.jks
          MOMENTO_SIGNING_STORE_PASSWORD: crestocustom
          MOMENTO_SIGNING_KEY_ALIAS: cresto
          MOMENTO_SIGNING_KEY_PASSWORD: crestocustom
        run: bash ./gradlew :app:assembleDebug --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false

      - name: Collect artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "未找到构建产物"
            exit 1
          fi
          cp "$APK" "dist/cresto-$TAG.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          cd ..
          python3 - "$TAG" "$CODE" "$NAME" "$GITHUB_REPOSITORY" <<'PY'
          import datetime
          import json
          import sys

          tag, code, name, repo = sys.argv[1:5]
          manifest = {
              "schemaVersion": 1,
              "platform": "android",
              "channel": "custom",
              "versionCode": int(code),
              "versionName": name,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "downloadUrl": f"https://github.com/{repo}/releases/download/{tag}/cresto-{tag}.apk",
              "description": {
                  "zh-CN": f"Cresto 定制版 {name}（versionCode {code}）",
                  "en": f"Cresto custom build {name} (versionCode {code})",
              },
          }
          with open("dist/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, ensure_ascii=False))
          PY
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cresto 定制版 ${{ steps.version.outputs.name }}"
          generate_release_notes: true
          body: |
            基于上游 Nevodev/Cresto 构建的定制版。

            - versionCode：${{ steps.version.outputs.code }}
            - versionName：${{ steps.version.outputs.name }}
            - 安装包使用仓库内固定 keystore 签名，可直接覆盖安装；与上游官方版签名不同，首次从上游版切换需要先卸载再安装。
            - 定制功能与分支说明见仓库中的 FORK.md。
          files: dist/*
