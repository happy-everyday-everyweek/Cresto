name: CI

on:
  push:
    branches:
      - master
      - custom
      - "feat/**"
  pull_request:
    branches:
      - master
      - custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKBIN=$(dirname "$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)")
          echo "使用 $SDKBIN/sdkmanager"
          yes | "$SDKBIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKBIN/sdkmanager" --install "platforms;android-37" > /dev/null
          BT=$("$SDKBIN/sdkmanager" --list 2>/dev/null | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          if [ -n "$BT" ]; then
            echo "安装 $BT"
            "$SDKBIN/sdkmanager" --install "$BT" > /dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false
