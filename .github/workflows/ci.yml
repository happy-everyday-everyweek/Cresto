name: CI

on:
  push:
    branches:
      - master
      - custom
      - "feat/**"
  pull_request:
    branches:
      - master
      - custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false
