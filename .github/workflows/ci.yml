name: CI

on:
  push:
    branches:
      - master
      - custom
      - "feat/**"
  pull_request:
    branches:
      - master
      - custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKBIN=$(dirname "$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)")
          echo "使用 $SDKBIN/sdkmanager"
          yes | "$SDKBIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          # API 37 的平台包名带小版本号（platforms;android-37.0）。
          "$SDKBIN/sdkmanager" --install "platforms;android-37.0" > /dev/null
          "$SDKBIN/sdkmanager" --install "build-tools;37.0.0" > /dev/null || true
          "$SDKBIN/sdkmanager" --list_installed 2>/dev/null | grep -E 'platforms;|build-tools;' | head -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-configuration-cache -Pandroid.aapt2.process.daemon=false
